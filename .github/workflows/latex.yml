name: Convert LaTeX to HTML

permissions:
  contents: write

on:
  push:
    paths:
      - 'theorems/**/*.tex'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

jobs:
  latex-to-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install LaTeXML
        run: |
          sudo apt-get update
          sudo apt-get install -y latexml

      - name: Convert changed LaTeX files
        run: |
          git diff --name-only HEAD^ HEAD -- 'theorems/*.tex' | while read file; do
            [ -e "$file" ] || continue

            filename="$(basename "$file")"
            base="${filename%.tex}"

            cd theorems

            latexmlc "$filename" \
              --destination="$base.html" \
              --format=html5 \
              --css=math.css

            cd ..

            # Add new files to the index
            if ! grep -q "(theorems/$base.html)" index.md; then
              echo "- [$base](theorems/$base.html)" >> index.md
            fi
          done

      - name: Commit generated HTML and update index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add theorems/*.html index.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Build LaTeX files to HTML"

          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 5
          done

          exit 1