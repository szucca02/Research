name: Convert LaTeX to HTML

permissions:
  contents: write

on:
  push:
    paths:
      - 'theorems/**/*.tex'
      - 'theorems/math.css'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

jobs:
  latex-to-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install LaTeXML
        run: |
          sudo apt-get update
          sudo apt-get install -y latexml

      - name: Convert changed LaTeX files
        run: |
          git diff --name-only HEAD^ HEAD -- 'theorems/*.tex' | while read file; do
            [ -e "$file" ] || continue
            base="${file%.tex}"
            latexmlc "$file" \
              --destination="$base.html" \
              --format=html5 \
              --css=math.css
          done

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add theorems/*.html

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Build LaTeX files to HTML"
          git pull --rebase origin main
          git push